spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/finance_tracker}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  liquibase:
    enabled: true
    change-log: classpath:changelog-master.yaml

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME:finance_tracker_bot}